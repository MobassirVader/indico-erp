<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IndiCo — ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Public+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   IndiCo ERP — stylesheet. All presentation lives here; no inline style=""
   attributes anywhere in the JS/HTML per the architecture standard.
   ========================================================================== */

:root {
  --ink: #15100d; --surface: #211915; --surface-2: #2c221c; --line: #3b2e25; --line-2: #4a3a2e;
  --paper: #f1e8db; --muted: #a3907e; --dim: #7b6a5b;
  --haldi: #e9a72c; --mirchi: #c43c2e; --dhania: #7e9a4e; --jeera: #b8793f;
  --good: #7e9a4e; --bad: #e4573d;
  --display: 'Fraunces', Georgia, serif; --body: 'Public Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--body); font-weight: 300; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.1; letter-spacing: -0.015em; }
.mono, .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
a { color: var(--haldi); }

/* ---------- app shell ---------- */
.app-loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--dim); font-family: var(--mono); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
.top { position: sticky; top: 0; z-index: 40; background: rgba(21, 16, 13, 0.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topin { max-width: 1320px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 900; font-size: 21px; color: var(--haldi); padding: 16px 0; letter-spacing: -0.01em; }
.logo span { color: var(--paper); }
.logo small { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; color: var(--dim); font-weight: 400; margin-top: -2px; }
nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
nav button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 20px 12px; cursor: pointer; transition: color 0.18s, border-color 0.18s; }
nav button:hover { color: var(--paper); }
nav button[aria-current="page"] { color: var(--haldi); border-color: var(--haldi); }
nav button:focus-visible { outline: 2px solid var(--paper); outline-offset: -4px; }
.logo-btn { background: transparent; border: 0; padding: 12px 0; cursor: pointer; display: flex; align-items: center; }
.logo-btn:focus-visible { outline: 2px solid var(--haldi); outline-offset: 2px; }
.logo-img { height: 40px; width: auto; display: block; }
.login-logo-img { height: 64px; width: auto; margin-bottom: 22px; }
.session-badge { display: flex; align-items: center; gap: 12px; margin-left: auto; padding: 12px 0; }
.session-who { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.session-role { color: var(--haldi); text-transform: uppercase; letter-spacing: 0.06em; }

/* ---------- login ---------- */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { background: var(--surface); border: 1px solid var(--line); padding: 36px 32px; max-width: 420px; width: 100%; }
.login-logo { font-family: var(--display); font-weight: 900; font-size: 26px; color: var(--haldi); margin-bottom: 22px; }
.login-logo span { color: var(--paper); }
.login-card h2 { font-size: 22px; margin-bottom: 10px; }
.login-note { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 18px; }
.login-error { background: rgba(228,87,61,0.12); border: 1px solid var(--bad); color: var(--bad); font-size: 12.5px; padding: 10px 12px; margin-bottom: 16px; }
.login-error.login-offline { background: rgba(233,167,44,0.12); border-color: var(--haldi); color: var(--haldi); }
.login-card .form { grid-template-columns: 1fr; }
.login-card .btn { width: 100%; padding: 13px 20px; }
.login-card .row-actions { flex-direction: column; align-items: stretch; }
.login-card .btn.ghost { border: 0; padding: 8px 0; text-align: center; }
main { max-width: 1320px; margin: 0 auto; padding: 34px 24px 90px; }
.view { display: none; }
.view.on { display: block; animation: fade 0.35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
.eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }
.phead h2 { font-size: clamp(24px, 3.2vw, 34px); margin-top: 8px; }
.phead p { margin: 8px 0 0; color: var(--muted); max-width: 68ch; font-size: 14px; }

/* ---------- kpis ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 28px; }
.kpi { background: var(--surface); padding: 18px 20px; }
.kpi .l { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.kpi .v { font-family: var(--mono); font-size: clamp(20px, 2.6vw, 28px); margin-top: 9px; letter-spacing: -0.02em; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.v-good { color: var(--good); } .v-bad { color: var(--bad); } .v-gold { color: var(--haldi); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); padding: 22px 24px; margin-bottom: 20px; }
.card > h3 { font-size: 19px; margin-bottom: 4px; }
.card > .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
.badge { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 3px 7px; border: 1px solid currentColor; margin-left: 8px; vertical-align: 2px; }

/* ---------- forms ---------- */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 16px; }
.f label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
input, select, textarea { width: 100%; background: var(--ink); border: 1px solid var(--line-2); color: var(--paper); font-family: var(--mono); font-size: 13.5px; padding: 9px 10px; border-radius: 0; }
textarea { font-family: var(--body); resize: vertical; min-height: 60px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--haldi); outline-offset: -2px; border-color: var(--haldi); }
.hint { font-size: 11.5px; color: var(--dim); margin-top: 5px; }
.field-error { color: var(--bad); font-size: 11.5px; margin-top: 4px; }
.btn { background: var(--haldi); color: var(--ink); border: 0; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 11px 20px; cursor: pointer; transition: filter 0.18s; }
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line-2); }
.btn.ghost:hover { color: var(--paper); border-color: var(--paper); filter: none; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); padding: 5px 9px; font-size: 10px; }
.row-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; align-items: center; }

/* ---------- tables ---------- */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 500; padding: 0 10px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:hover td { background: var(--surface-2); }
tfoot td { font-family: var(--mono); font-weight: 600; border-top: 1px solid var(--line-2); border-bottom: 0; background: var(--surface-2); }
.tag { font-family: var(--mono); font-size: 10px; padding: 3px 7px; border: 1px solid currentColor; white-space: nowrap; }
.tag-good { color: var(--good); } .tag-warn { color: var(--haldi); } .tag-bad { color: var(--bad); } .tag-mute { color: var(--dim); }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; vertical-align: 1px; border-radius: 50%; }
.empty { color: var(--dim); font-size: 13.5px; padding: 26px 0; text-align: center; border: 1px dashed var(--line-2); }

/* ---------- batch cards ---------- */
.lot { border: 1px solid var(--line); background: var(--surface); margin-bottom: 14px; }
.lot summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.lot summary::-webkit-details-marker { display: none; }
.lot summary:hover { background: var(--surface-2); }
.lot .lid { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: 0.1em; }
.lot .lname { font-family: var(--display); font-size: 18px; }
.lot .chip { font-family: var(--mono); font-size: 11.5px; color: var(--muted); border: 1px solid var(--line-2); padding: 3px 8px; }
.lot .chip b { color: var(--paper); font-weight: 600; }
.lot .body { padding: 0 20px 20px; border-top: 1px solid var(--line); }
.lot[open] summary { border-bottom: 1px solid var(--line); }
.chip-dot { display: inline-block; width: 9px; height: 9px; margin-right: 2px; border-radius: 50%; }

.batch-status { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border: 1px solid currentColor; text-transform: uppercase; }
.batch-status.draft { color: var(--haldi); }
.batch-status.completed { color: var(--good); }

/* ---------- bars / trends ---------- */
.bar { display: block; height: 6px; background: var(--good); min-width: 2px; }
.bar.bad { background: var(--bad); }
.stack { display: flex; height: 26px; border: 1px solid var(--line-2); }
.stack span { display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; }
.sparkrow { display: flex; align-items: flex-end; gap: 3px; height: 60px; }
.sparkrow span { flex: 1; background: var(--haldi); min-height: 2px; }
.sparkrow span.neg { background: var(--bad); }

/* ---------- test panel ---------- */
.test-line { font-family: var(--mono); font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.test-line .mark { width: 46px; flex: none; }
.test-line.pass .mark { color: var(--good); }
.test-line.fail .mark { color: var(--bad); }
.test-summary { font-family: var(--mono); font-size: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-2); }

/* ---------- toast ---------- */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--haldi); color: var(--ink); font-family: var(--mono); font-size: 12.5px; padding: 11px 20px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 99; max-width: 90vw; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.toast.error { background: var(--bad); color: var(--paper); }

/* ---------- storage status ---------- */
.store-status { display: flex; align-items: center; gap: 10px; }

@media (max-width: 700px) {
  nav { margin-left: 0; width: 100%; }
  nav button { padding: 12px 8px; }
  main { padding: 24px 16px 70px; }
  .topin { padding: 0 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
